name: Tests

# S1: run the full test suite automatically on every push and pull request so
# each subsequent TDD step (S2-S14) is verified in CI, not just locally.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No dependency install on purpose. The entire test suite (web + macos)
      # runs on Node built-ins with injected fakes -- see docs/macos-step-plan.md
      # section 0. Installing the macOS workspace's Electron toolchain would pull
      # hundreds of packages plus platform binaries for zero testing benefit, so
      # CI stays install-free and fast. If a future step adds a real test-time
      # dependency, refresh the lockfile and add an `npm ci` step here.
      - name: Run tests
        run: npm test
